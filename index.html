<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115">
<title>Flip Tracker</title>
<style>
:root{--bg:#0f1115;--panel:#181b21;--panel2:#22262e;--line:#343a45;--text:#f2f4f7;--muted:#9aa2ad;--orange:#ff6b35;--green:#43b581;--blue:#4d9de0;--yellow:#e3ad3d;--red:#e05a5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand h1{margin:0;font-size:32px}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px;letter-spacing:.08em}.btn{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700}.btn:hover{filter:brightness(1.12)}.primary{background:var(--orange);border-color:var(--orange);color:#17100c}.btn:disabled{opacity:.55}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.stat strong{display:block;font-size:21px}.stat span,.muted{color:var(--muted);font-size:11px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.column{background:#14171c;border:1px solid var(--line);border-radius:10px;min-height:260px;overflow:hidden}.column-head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}.count{background:var(--panel2);padding:2px 8px;border-radius:99px;color:var(--muted)}.cards{padding:10px;display:grid;gap:10px}.empty{color:#68717c;font-size:12px;text-align:center;padding:24px 5px}.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px;cursor:pointer}.card:hover{border-color:#626b78}.card-title{font-weight:800;padding-right:24px}.card-sub{color:var(--muted);font-size:12px;margin-top:3px}.card-grid{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;display:grid;gap:5px;font-size:12px}.line{display:flex;justify-content:space-between;gap:10px}.line span:first-child{color:var(--muted)}.delete{border:0;background:transparent;color:#7b8490;font-size:19px}.card>.delete{position:absolute;top:6px;right:7px}.delete:hover{color:var(--red)}dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);width:min(700px,calc(100% - 24px));max-height:90vh;padding:0;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#000b}.modal{padding:20px}.modal-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:16px}.modal-head h2{margin:0;font-size:21px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.x{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:7px;font-size:20px;width:36px;height:36px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px}input:focus,select:focus{outline:2px solid var(--orange);outline-offset:1px}.vin-row,.need-row{display:flex;gap:8px}.status{min-height:16px;color:var(--muted);font-size:11px;margin-top:3px}.good,.profit{color:var(--green)}.bad,.error{color:#ff8b8b}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px}.tab.active{color:var(--orange);border-bottom-color:var(--orange)}.summary{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px;display:grid;gap:7px}.need-form{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}.need-list{display:grid;gap:8px}.need{display:grid;grid-template-columns:auto 1fr 105px auto;align-items:center;gap:10px;border:1px solid var(--line);background:#1b1f26;border-radius:8px;padding:10px}.need.done .need-name{text-decoration:line-through;color:var(--muted)}.need-state{font-size:10px;color:var(--yellow);margin-top:2px}.need.done .need-state{color:var(--green)}.cost{padding:7px;font-size:12px}.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0 0 12px}.stage-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.error{font-size:12px;margin-top:10px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{padding:14px}.brand h1{font-size:27px}.stats,.board,.grid{grid-template-columns:1fr}.full{grid-column:auto}.vin-row,.need-row{flex-direction:column}.need{grid-template-columns:auto 1fr auto}.need .cost{grid-column:2/3}.column{min-height:120px}}
</style>
</head>
<body>
<main class="app"><header class="top"><div class="brand"><h1>FLIP TRACKER</h1><p>SOURCED → RECON → LISTED → SOLD</p></div><button class="btn primary" id="newCarBtn">+ New car</button></header><section class="stats" id="stats"></section><section class="board" id="board"></section></main>
<dialog id="intakeDialog"><form class="modal" id="intakeForm"><div class="modal-head"><div><h2>Add a car</h2><p>Enter the VIN first to fill vehicle details automatically.</p></div><button class="x" type="button" data-close-intake>×</button></div><div class="grid">
<div class="field full"><label>VIN</label><div class="vin-row"><input id="vin" maxlength="17" placeholder="17-character VIN" autocomplete="off"><button class="btn" type="button" id="decodeBtn">Decode VIN</button></div><div class="status" id="vinStatus">0/17 characters</div></div>
<div class="field"><label>Year</label><input id="year" placeholder="2018"></div><div class="field"><label>Make</label><input id="make" placeholder="Honda"></div><div class="field"><label>Model</label><input id="model" placeholder="Accord"></div><div class="field"><label>Trim</label><input id="trim" placeholder="EX-L"></div><div class="field"><label>Mileage</label><input id="mileage" type="number" min="0" placeholder="94000"></div><div class="field"><label>Purchase price</label><input id="purchasePrice" type="number" min="0" step=".01" placeholder="8500"></div><div class="field"><label>Purchase date</label><input id="purchaseDate" type="date"></div><div class="field"><label>Source</label><input id="source" placeholder="Auction, Marketplace..."></div><div class="field"><label>Title status</label><select id="titleStatus"><option>Clean</option><option>Salvage</option><option>Rebuilt</option><option>Other</option></select></div></div><div class="error" id="intakeError"></div><div class="modal-foot"><button class="btn" type="button" data-close-intake>Cancel</button><button class="btn primary" type="submit">Add to board</button></div></form></dialog>
<dialog id="detailDialog"><div class="modal" id="detailContent"></div></dialog>
<script>
(()=>{'use strict';
const KEY='flip_tracker_clean_v1',stages=['sourced','recon','listed','sold'],labels={sourced:'SOURCED',recon:'IN RECON',listed:'LISTED',sold:'SOLD'},colors={sourced:'var(--yellow)',recon:'var(--orange)',listed:'var(--blue)',sold:'var(--green)'},commonNeeds=['Order parts','Basic detail','Professional detail','Body shop','Tires','Brakes','Oil change','Mechanical repair','Other'];
let cars=load(),selectedId=null,activeTab='needs';const $=id=>document.getElementById(id),money=v=>(Number(v)||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now(),total=c=>(c.needs||[]).reduce((s,n)=>s+(Number(n.cost)||0),0),profit=c=>(Number(c.soldPrice)||0)-(Number(c.purchasePrice)||0)-total(c);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(cars));render()}function current(){return cars.find(c=>c.id===selectedId)}function title(c){return[c.year,c.make,c.model,c.trim].filter(Boolean).join(' ')||'Untitled car'}
function render(){const active=cars.filter(c=>c.stage!=='sold'),sold=cars.filter(c=>c.stage==='sold'),invested=active.reduce((s,c)=>s+(Number(c.purchasePrice)||0)+total(c),0),realized=sold.reduce((s,c)=>s+profit(c),0);$('stats').innerHTML=[['Active inventory',active.length],['Invested (active)',money(invested)],['Realized profit',money(realized)],['Cars sold',sold.length],['Total cars',cars.length]].map(([l,v])=>`<div class="stat"><strong>${v}</strong><span>${l}</span></div>`).join('');$('board').innerHTML=stages.map(stage=>{const list=cars.filter(c=>c.stage===stage);return `<section class="column"><div class="column-head" style="color:${colors[stage]}"><span>${labels[stage]}</span><span class="count">${list.length}</span></div><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">No cars in this stage</div>'}</div></section>`}).join('')}
function card(c){const pending=(c.needs||[]).filter(n=>!n.done).length;return `<article class="card" data-open="${c.id}"><button class="delete" data-delete="${c.id}">×</button><div class="card-title">${esc(title(c))}</div><div class="card-sub">${c.vin?'VIN …'+esc(c.vin.slice(-6)):'No VIN'} · ${c.mileage?Number(c.mileage).toLocaleString()+' miles':'Mileage not set'}</div><div class="card-grid"><div class="line"><span>Purchase</span><b>${money(c.purchasePrice)}</b></div><div class="line"><span>Needs/costs</span><b>${money(total(c))}</b></div><div class="line"><span>Pending items</span><b>${pending}</b></div>${c.stage==='sold'?`<div class="line"><span>Profit</span><b class="profit">${money(profit(c))}</b></div>`:''}</div></article>`}
$('board').onclick=e=>{const d=e.target.closest('[data-delete]');if(d){e.stopPropagation();if(confirm('Delete this car?')){cars=cars.filter(c=>c.id!==d.dataset.delete);save()}return}const c=e.target.closest('[data-open]');if(c)openDetail(c.dataset.open)};
$('newCarBtn').onclick=()=>{$('intakeForm').reset();$('vinStatus').textContent='0/17 characters';$('vinStatus').className='status';$('intakeError').textContent='';$('intakeDialog').showModal()};document.querySelectorAll('[data-close-intake]').forEach(b=>b.onclick=()=>$('intakeDialog').close());
$('vin').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'').slice(0,17);$('vinStatus').textContent=e.target.value.length+'/17 characters';$('vinStatus').className='status'};
$('decodeBtn').onclick=async()=>{const vin=$('vin').value,status=$('vinStatus');if(vin.length!==17){status.textContent='Enter a complete 17-character VIN.';status.className='status bad';return}$('decodeBtn').disabled=true;status.textContent='Looking up VIN…';try{const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json');if(!r.ok)throw 0;const v=(await r.json()).Results?.[0];if(!v?.Make||!v?.Model||!v?.ModelYear)throw 0;$('year').value=v.ModelYear;$('make').value=v.Make;$('model').value=v.Model;$('trim').value=v.Trim||v.Series||'';status.textContent=`Found: ${v.ModelYear} ${v.Make} ${v.Model}`;status.className='status good'}catch{status.textContent='Could not decode this VIN. Check it and try again.';status.className='status bad'}finally{$('decodeBtn').disabled=false}};
$('intakeForm').onsubmit=e=>{e.preventDefault();const get=id=>$(id).value.trim();if(!get('make')||!get('model')){$('intakeError').textContent='Enter at least the make and model.';return}cars.push({id:uid(),vin:get('vin'),year:get('year'),make:get('make'),model:get('model'),trim:get('trim'),mileage:get('mileage'),purchasePrice:get('purchasePrice'),purchaseDate:get('purchaseDate'),source:get('source'),titleStatus:get('titleStatus'),stage:'sourced',needs:[],soldPrice:'',soldDate:''});save();$('intakeDialog').close()};
function openDetail(id){selectedId=id;activeTab='needs';drawDetail();$('detailDialog').showModal()}function drawDetail(){const c=current();if(!c)return $('detailDialog').close();$('detailContent').innerHTML=`<div class="modal-head"><div><h2>${esc(title(c))}</h2><p>${c.vin?'VIN '+esc(c.vin):'No VIN entered'}</p></div><button class="x" data-close>×</button></div><div class="tabs"><button class="tab ${activeTab==='needs'?'active':''}" data-tab="needs">Needs & Costs</button><button class="tab ${activeTab==='overview'?'active':''}" data-tab="overview">Overview</button><button class="tab ${activeTab==='sale'?'active':''}" data-tab="sale">Sale</button></div><div>${activeTab==='needs'?needs(c):activeTab==='overview'?overview(c):sale(c)}</div>`}
function needs(c){const items=c.needs||[],completed=items.filter(i=>i.done).reduce((s,i)=>s+(Number(i.cost)||0),0);return `<p class="hint">Add everything this car needs, enter the amount paid, and check it when completed.</p><div class="need-form"><div class="need-row"><select id="needType">${commonNeeds.map(n=>`<option>${n}</option>`).join('')}</select><input id="needCustom" placeholder="Describe custom work" hidden><input id="needCost" type="number" min="0" step=".01" placeholder="Amount paid"><button class="btn primary" id="addNeed">Add</button></div></div><div class="need-list">${items.length?items.map(i=>`<div class="need ${i.done?'done':''}"><input type="checkbox" data-toggle="${i.id}" ${i.done?'checked':''}><div><div class="need-name">${esc(i.task)}</div><div class="need-state">${i.done?'COMPLETED':'NEEDS ATTENTION'}</div></div><input class="cost" type="number" min="0" step=".01" value="${esc(i.cost)}" placeholder="Amount" data-cost="${i.id}"><button class="delete" data-remove="${i.id}">×</button></div>`).join(''):'<div class="empty">Nothing has been added yet.</div>'}</div><div class="summary"><div class="line"><span>Items still needed</span><b>${items.filter(i=>!i.done).length}</b></div><div class="line"><span>Completed work paid</span><b>${money(completed)}</b></div><div class="line"><span>Total costs</span><b>${money(total(c))}</b></div><div class="line"><span>All-in vehicle cost</span><b>${money((Number(c.purchasePrice)||0)+total(c))}</b></div></div>`}
function overview(c){return `<div class="grid">${[['year','Year'],['make','Make'],['model','Model'],['trim','Trim'],['mileage','Mileage'],['purchasePrice','Purchase price'],['source','Source']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-field="${k}" value="${esc(c[k])}"></div>`).join('')}<div class="field"><label>Title status</label><select data-field="titleStatus">${['Clean','Salvage','Rebuilt','Other'].map(v=>`<option ${c.titleStatus===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="stage-actions">${stages.map(s=>`<button class="btn ${c.stage===s?'primary':''}" data-stage="${s}">${labels[s]}</button>`).join('')}</div>`}
function sale(c){return `<p class="hint">Record the sale to calculate realized profit.</p><div class="grid"><div class="field"><label>Sale price</label><input id="soldPrice" type="number" min="0" step=".01" value="${esc(c.soldPrice)}"></div><div class="field"><label>Sale date</label><input id="soldDate" type="date" value="${esc(c.soldDate)}"></div></div><div class="summary"><div class="line"><span>Purchase price</span><b>${money(c.purchasePrice)}</b></div><div class="line"><span>Needs & costs</span><b>${money(total(c))}</b></div><div class="line"><span>Estimated profit</span><b class="profit">${money((Number(c.soldPrice)||0)-(Number(c.purchasePrice)||0)-total(c))}</b></div></div><div class="modal-foot"><button class="btn primary" id="markSold">Save sale & mark sold</button></div>`}
$('detailContent').onclick=e=>{if(e.target.closest('[data-close]'))return $('detailDialog').close();const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;drawDetail();return}const st=e.target.closest('[data-stage]');if(st){current().stage=st.dataset.stage;save();drawDetail();return}const t=e.target.closest('[data-toggle]');if(t){current().needs.find(i=>i.id===t.dataset.toggle).done=t.checked;save();drawDetail();return}const r=e.target.closest('[data-remove]');if(r){current().needs=current().needs.filter(i=>i.id!==r.dataset.remove);save();drawDetail();return}if(e.target.id==='addNeed'){const type=$('needType').value,task=type==='Other'?$('needCustom').value.trim():type;if(task){current().needs.push({id:uid(),task,cost:$('needCost').value,done:false});save();drawDetail()}}if(e.target.id==='markSold'){const c=current();c.soldPrice=$('soldPrice').value;c.soldDate=$('soldDate').value||new Date().toISOString().slice(0,10);c.stage='sold';save();drawDetail()}};
$('detailContent').onchange=e=>{if(e.target.id==='needType'){const x=$('needCustom');x.hidden=e.target.value!=='Other';if(!x.hidden)x.focus();return}if(e.target.matches('[data-cost]')){current().needs.find(i=>i.id===e.target.dataset.cost).cost=e.target.value;save();drawDetail()}if(e.target.matches('[data-field]')){current()[e.target.dataset.field]=e.target.value;save();drawDetail()}};
$('detailDialog').onclick=e=>{if(e.target===$('detailDialog'))$('detailDialog').close()};$('intakeDialog').onclick=e=>{if(e.target===$('intakeDialog'))$('intakeDialog').close()};render();
})();
</script>
</body></html>
