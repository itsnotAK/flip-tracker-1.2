<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
  html, body { margin: 0; background: #0F1013; color: #EDEEF1; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .stamp { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #33373F; border-radius: 4px; }
  input, select, textarea { font-family: 'Space Grotesk', sans-serif; }
  button { cursor: pointer; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #E85D2C; outline-offset: 1px; }
  #root { max-width: 1100px; margin: 0 auto; padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo } = React;

const STAGES = ['sourced', 'recon', 'listed', 'sold'];
const STAGE_LABEL = { sourced: 'SOURCED', recon: 'IN RECON', listed: 'LISTED', sold: 'SOLD' };
const STAGE_COLOR = { sourced: '#D9A441', recon: '#E85D2C', listed: '#4C8FBF', sold: '#4FA876' };
const TITLE_STATUSES = ['Clean', 'Salvage', 'Rebuilt', 'Other'];

const fmtMoney = (n) => {
  const v = Number(n);
  if (isNaN(v)) return '$0';
  return v.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
};
const daysBetween = (a, b) => {
  if (!a || !b) return null;
  const d = Math.round((new Date(b) - new Date(a)) / 86400000);
  return isNaN(d) ? null : d;
};
const uid = () => Math.random().toString(36).slice(2, 10);
const STORAGE_KEY = 'flip_tracker_cars_v1';

function emptyCar() {
  return {
    id: uid(), year: '', make: '', model: '', trim: '', vin: '', mileage: '',
    purchasePrice: '', purchaseDate: '', source: '', titleStatus: 'Clean',
    stage: 'sourced', reconItems: [], comps: [], targetPrice: '',
    listedDate: '', listingDescription: '', soldPrice: '', soldDate: '',
  };
}

function FlipTracker() {
  const [cars, setCars] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [showIntake, setShowIntake] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [tab, setTab] = useState('overview');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [copyLabel, setCopyLabel] = useState('Copy');

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setCars(JSON.parse(raw));
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cars)); } catch (e) {}
  }, [cars, loaded]);

  const selected = cars.find(c => c.id === selectedId) || null;
  const updateCar = (id, patch) => setCars(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  const deleteCar = (id) => { setCars(cs => cs.filter(c => c.id !== id)); setConfirmDelete(null); if (selectedId === id) setSelectedId(null); };

  const stats = useMemo(() => {
    const active = cars.filter(c => c.stage !== 'sold');
    const sold = cars.filter(c => c.stage === 'sold');
    const invested = active.reduce((sum, c) => {
      const recon = (c.reconItems || []).reduce((s, r) => s + (Number(r.cost) || 0), 0);
      return sum + (Number(c.purchasePrice) || 0) + recon;
    }, 0);
    const profit = sold.reduce((sum, c) => {
      const recon = (c.reconItems || []).reduce((s, r) => s + (Number(r.cost) || 0), 0);
      return sum + ((Number(c.soldPrice) || 0) - (Number(c.purchasePrice) || 0) - recon);
    }, 0);
    const flipDays = sold.map(c => daysBetween(c.purchaseDate, c.soldDate)).filter(d => d !== null);
    const avgDays = flipDays.length ? Math.round(flipDays.reduce((a, b) => a + b, 0) / flipDays.length) : null;
    return { activeCount: active.length, invested, profit, avgDays, soldCount: sold.length };
  }, [cars]);

  function reconTotal(c) { return (c.reconItems || []).reduce((s, r) => s + (Number(r.cost) || 0), 0); }

  function addCarFromForm(form) { setCars(cs => [...cs, { ...emptyCar(), ...form, id: uid() }]); setShowIntake(false); }
  function addReconItem(carId, task, cost) {
    if (!task) return;
    updateCar(carId, { reconItems: [...(selected.reconItems || []), { id: uid(), task, cost: cost || 0, done: false }] });
  }
  function toggleRecon(carId, itemId) { updateCar(carId, { reconItems: selected.reconItems.map(r => r.id === itemId ? { ...r, done: !r.done } : r) }); }
  function updateReconItem(carId, itemId, patch) { updateCar(carId, { reconItems: selected.reconItems.map(r => r.id === itemId ? { ...r, ...patch } : r) }); }
  function removeRecon(carId, itemId) { updateCar(carId, { reconItems: selected.reconItems.filter(r => r.id !== itemId) }); }
  function addComp(carId, source, price, notes) {
    if (!price) return;
    updateCar(carId, { comps: [...(selected.comps || []), { id: uid(), source: source || 'Comp', price, notes: notes || '' }] });
  }
  function removeComp(carId, compId) { updateCar(carId, { comps: selected.comps.filter(c => c.id !== compId) }); }

  function advanceStage(car) {
    if (car.stage === 'sourced') updateCar(car.id, { stage: 'recon' });
    else if (car.stage === 'recon') updateCar(car.id, { stage: 'listed', listedDate: car.listedDate || new Date().toISOString().slice(0, 10) });
    else if (car.stage === 'listed') setTab('sell');
  }
  function markSold(car, soldPrice, soldDate) { updateCar(car.id, { stage: 'sold', soldPrice, soldDate: soldDate || new Date().toISOString().slice(0, 10) }); }

  function generateListing(car) {
    const title = [car.year, car.make, car.model, car.trim].filter(Boolean).join(' ');
    const workDone = (car.reconItems || []).filter(r => r.done).map(r => r.task);
    const lines = [];
    lines.push(`${title}`.trim());
    if (car.mileage) lines.push(`${Number(car.mileage).toLocaleString()} miles`);
    if (car.titleStatus) lines.push(`Title: ${car.titleStatus}`);
    if (workDone.length) lines.push(`\nRecent work completed:\n- ${workDone.join('\n- ')}`);
    lines.push(`\nAsking ${car.targetPrice ? fmtMoney(car.targetPrice) : 'price TBD'}. Serious inquiries only, cash or verified funds.`);
    updateCar(car.id, { listingDescription: lines.join('\n') });
  }

  const compSuggestedPrice = (car) => {
    const prices = (car.comps || []).map(c => Number(c.price)).filter(n => !isNaN(n) && n > 0).sort((a, b) => a - b);
    if (!prices.length) return null;
    const mid = Math.floor(prices.length / 2);
    return prices.length % 2 ? prices[mid] : Math.round((prices[mid - 1] + prices[mid]) / 2);
  };

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div>
          <div className="stamp" style={styles.title}>FLIP TRACKER</div>
          <div style={styles.subtitle}>SOURCED &rarr; RECON &rarr; LISTED &rarr; SOLD</div>
        </div>
        <button style={styles.newBtn} onClick={() => setShowIntake(true)}>+ New car</button>
      </header>

      <div style={styles.statsBar}>
        <Stat label="Active inventory" value={stats.activeCount} />
        <Divider />
        <Stat label="Invested (active)" value={fmtMoney(stats.invested)} />
        <Divider />
        <Stat label="Realized profit" value={fmtMoney(stats.profit)} accent={stats.profit >= 0 ? '#4FA876' : '#D4574A'} />
        <Divider />
        <Stat label="Avg days to flip" value={stats.avgDays !== null ? stats.avgDays : '—'} />
        <Divider />
        <Stat label="Cars sold" value={stats.soldCount} />
      </div>

      <div style={styles.board}>
        {STAGES.map(stage => {
          const stageCars = cars.filter(c => c.stage === stage);
          return (
            <div key={stage} style={styles.column}>
              <div style={styles.columnHeader}>
                <span className="stamp" style={{ ...styles.columnTitle, color: STAGE_COLOR[stage] }}>{STAGE_LABEL[stage]}</span>
                <span className="mono" style={styles.columnCount}>{stageCars.length}</span>
              </div>
              <div style={styles.columnBody}>
                {stageCars.length === 0 && <div style={styles.emptyCol}>No cars in this stage yet</div>}
                {stageCars.map(car => (
                  <Ticket key={car.id} car={car} reconTotal={reconTotal(car)}
                    onClick={() => { setSelectedId(car.id); setTab('recon'); }}
                    onDelete={() => setConfirmDelete(car.id)}
                    confirming={confirmDelete === car.id}
                    onConfirmDelete={() => deleteCar(car.id)}
                    onCancelDelete={() => setConfirmDelete(null)} />
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {showIntake && <IntakeModal onClose={() => setShowIntake(false)} onSave={addCarFromForm} />}

      {selected && (
        <DetailModal car={selected} tab={tab} setTab={setTab} onClose={() => setSelectedId(null)}
          onUpdate={(patch) => updateCar(selected.id, patch)}
          onAdvance={() => advanceStage(selected)}
          onAddRecon={(task, cost) => addReconItem(selected.id, task, cost)}
          onToggleRecon={(itemId) => toggleRecon(selected.id, itemId)}
          onUpdateRecon={(itemId, patch) => updateReconItem(selected.id, itemId, patch)}
          onRemoveRecon={(itemId) => removeRecon(selected.id, itemId)}
          onAddComp={(source, price, notes) => addComp(selected.id, source, price, notes)}
          onRemoveComp={(compId) => removeComp(selected.id, compId)}
          onGenerateListing={() => generateListing(selected)}
          onMarkSold={(price, date) => markSold(selected, price, date)}
          suggestedPrice={compSuggestedPrice(selected)}
          reconTotal={reconTotal(selected)}
          copyLabel={copyLabel} setCopyLabel={setCopyLabel} />
      )}
    </div>
  );
}

function Stat({ label, value, accent }) {
  return (
    <div style={styles.stat}>
      <div className="mono" style={{ ...styles.statValue, color: accent || '#EDEEF1' }}>{value}</div>
      <div style={styles.statLabel}>{label}</div>
    </div>
  );
}
function Divider() { return <div style={styles.vDivider}></div>; }

function Ticket({ car, reconTotal, onClick, onDelete, confirming, onConfirmDelete, onCancelDelete }) {
  const title = [car.year, car.make, car.model].filter(Boolean).join(' ') || 'Untitled car';
  const stageColor = STAGE_COLOR[car.stage];
  const days = car.stage === 'listed' ? daysBetween(car.listedDate, new Date().toISOString().slice(0, 10)) : null;
  const profit = car.stage === 'sold' ? (Number(car.soldPrice) || 0) - (Number(car.purchasePrice) || 0) - reconTotal : null;
  return (
    <div style={styles.ticket}>
      <div className="stamp" style={{ ...styles.stampBadge, borderColor: stageColor, color: stageColor }}>{STAGE_LABEL[car.stage]}</div>
      <div style={styles.ticketStub} onClick={onClick}>
        <div style={styles.ticketTitle}>{title}</div>
        {car.trim && <div style={styles.ticketTrim}>{car.trim}</div>}
        <div className="mono" style={styles.ticketVin}>{car.vin ? `VIN ${car.vin.slice(-6)}` : 'No VIN'}</div>
      </div>
      <div style={styles.ticketBody} onClick={onClick}>
        <Row label="Purchase" value={fmtMoney(car.purchasePrice)} />
        {car.stage === 'recon' && <Row label="Recon cost" value={fmtMoney(reconTotal)} />}
        {car.stage === 'listed' && <Row label="Asking" value={car.targetPrice ? fmtMoney(car.targetPrice) : '—'} />}
        {car.stage === 'listed' && days !== null && <Row label="Days listed" value={days} />}
        {car.stage === 'sold' && <Row label="Profit" value={fmtMoney(profit)} accent={profit >= 0 ? '#4FA876' : '#D4574A'} />}
      </div>
      <div style={styles.ticketFooter}>
        {!confirming ? (
          <button style={styles.iconBtn} onClick={onDelete}>Delete</button>
        ) : (
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <span style={{ fontSize: 11, color: '#D4574A' }}>Delete this car?</span>
            <button style={{ ...styles.iconBtn, color: '#D4574A' }} onClick={onConfirmDelete}>Yes</button>
            <button style={styles.iconBtn} onClick={onCancelDelete}>No</button>
          </div>
        )}
      </div>
    </div>
  );
}

function Row({ label, value, accent }) {
  return (
    <div style={styles.row}>
      <span style={styles.rowLabel}>{label}</span>
      <span className="mono" style={{ ...styles.rowValue, color: accent }}>{value}</span>
    </div>
  );
}

function IntakeModal({ onClose, onSave }) {
  const [f, setF] = useState({ year: '', make: '', model: '', trim: '', vin: '', mileage: '', purchasePrice: '', purchaseDate: '', source: '', titleStatus: 'Clean' });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const [error, setError] = useState('');
  const [vinStatus, setVinStatus] = useState('');
  const [decodingVin, setDecodingVin] = useState(false);

  function setVin(e) {
    const vin = e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '').slice(0, 17);
    setF(current => ({ ...current, vin }));
    setVinStatus('');
  }

  async function decodeVin() {
    if (f.vin.length !== 17) {
      setVinStatus('Enter a complete 17-character VIN.');
      return;
    }

    setDecodingVin(true);
    setVinStatus('Looking up VIN...');
    try {
      const url = `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(f.vin)}?format=json`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('VIN service unavailable');
      const data = await response.json();
      const vehicle = data.Results && data.Results[0];
      if (!vehicle || !vehicle.Make || !vehicle.Model || !vehicle.ModelYear) {
        throw new Error(vehicle?.ErrorText || 'VIN could not be decoded');
      }

      setF(current => ({
        ...current,
        year: vehicle.ModelYear || current.year,
        make: vehicle.Make || current.make,
        model: vehicle.Model || current.model,
        trim: vehicle.Trim || vehicle.Series || current.trim,
      }));
      setVinStatus(`Found: ${vehicle.ModelYear} ${vehicle.Make} ${vehicle.Model}${vehicle.Trim ? ` ${vehicle.Trim}` : ''}`);
      setError('');
    } catch (err) {
      setVinStatus('Could not decode this VIN. Check it and try again.');
    } finally {
      setDecodingVin(false);
    }
  }

  function submit() {
    if (!f.make.trim() || !f.model.trim()) { setError('Enter at least a make and model.'); return; }
    onSave(f);
  }
  return (
    <Overlay onClose={onClose}>
      <div style={styles.modal}>
        <ModalHeader title="Intake a car" onClose={onClose} />
        <div style={styles.formGrid}>
          <Field label="Year"><input style={styles.input} value={f.year} onChange={set('year')} placeholder="2018" /></Field>
          <Field label="Make"><input style={styles.input} value={f.make} onChange={set('make')} placeholder="Honda" /></Field>
          <Field label="Model"><input style={styles.input} value={f.model} onChange={set('model')} placeholder="Accord" /></Field>
          <Field label="Trim"><input style={styles.input} value={f.trim} onChange={set('trim')} placeholder="EX-L" /></Field>
          <div style={{ ...styles.field, gridColumn: '1 / -1' }}>
            <label style={styles.fieldLabel}>VIN</label>
            <div style={styles.vinRow}>
              <input className="mono" style={styles.input} value={f.vin} onChange={setVin} placeholder="Enter 17-character VIN" inputMode="text" autoCapitalize="characters" />
              <button type="button" style={{ ...styles.secondaryBtn, whiteSpace: 'nowrap' }} onClick={decodeVin} disabled={decodingVin}>
                {decodingVin ? 'Decoding...' : 'Decode VIN'}
              </button>
            </div>
            <div className="mono" style={{ ...styles.vinStatus, color: vinStatus.startsWith('Found:') ? '#4FA876' : '#888D96' }}>
              {vinStatus || `${f.vin.length}/17 characters`}
            </div>
          </div>
          <Field label="Mileage at purchase"><input style={styles.input} value={f.mileage} onChange={set('mileage')} placeholder="94000" /></Field>
          <Field label="Purchase price"><input style={styles.input} value={f.purchasePrice} onChange={set('purchasePrice')} placeholder="8500" /></Field>
          <Field label="Purchase date"><input type="date" style={styles.input} value={f.purchaseDate} onChange={set('purchaseDate')} /></Field>
          <Field label="Source"><input style={styles.input} value={f.source} onChange={set('source')} placeholder="Copart, FB Marketplace..." /></Field>
          <Field label="Title status">
            <select style={styles.input} value={f.titleStatus} onChange={set('titleStatus')}>
              {TITLE_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
        </div>
        {error && <div style={styles.errorText}>{error}</div>}
        <div style={styles.modalFooter}>
          <button style={styles.secondaryBtn} onClick={onClose}>Cancel</button>
          <button style={styles.primaryBtn} onClick={submit}>Add to board</button>
        </div>
      </div>
    </Overlay>
  );
}

function DetailModal({ car, tab, setTab, onClose, onUpdate, onAdvance, onAddRecon, onToggleRecon, onUpdateRecon, onRemoveRecon, onAddComp, onRemoveComp, onGenerateListing, onMarkSold, suggestedPrice, reconTotal, copyLabel, setCopyLabel }) {
  const title = [car.year, car.make, car.model, car.trim].filter(Boolean).join(' ') || 'Untitled car';
  const tabs = ['overview', 'recon', 'comps', 'listing'];
  if (car.stage === 'listed') tabs.push('sell');
  const advanceLabel = { sourced: 'Start recon', recon: 'Ready to list', listed: 'Mark sold' }[car.stage];
  return (
    <Overlay onClose={onClose}>
      <div style={{ ...styles.modal, maxWidth: 640 }}>
        <ModalHeader title={title} subtitle={car.vin ? `VIN ${car.vin}` : ''} onClose={onClose}
          right={advanceLabel && (
            <button style={styles.primaryBtn} onClick={() => car.stage === 'listed' ? setTab('sell') : onAdvance()}>{advanceLabel} &rarr;</button>
          )} />
        <div style={styles.tabBar}>
          {tabs.map(t => (
            <button key={t} onClick={() => setTab(t)} style={{ ...styles.tabBtn, ...(tab === t ? styles.tabBtnActive : {}) }}>
              {t === 'sell' ? 'Mark sold' : t === 'recon' ? 'Needs & costs' : t.charAt(0).toUpperCase() + t.slice(1)}
            </button>
          ))}
        </div>
        <div style={styles.tabContent}>
          {tab === 'overview' && <OverviewTab car={car} onUpdate={onUpdate} reconTotal={reconTotal} />}
          {tab === 'recon' && <ReconTab car={car} onAddRecon={onAddRecon} onToggleRecon={onToggleRecon} onUpdateRecon={onUpdateRecon} onRemoveRecon={onRemoveRecon} reconTotal={reconTotal} />}
          {tab === 'comps' && <CompsTab car={car} onAddComp={onAddComp} onRemoveComp={onRemoveComp} onUpdate={onUpdate} suggestedPrice={suggestedPrice} />}
          {tab === 'listing' && <ListingTab car={car} onUpdate={onUpdate} onGenerate={onGenerateListing} copyLabel={copyLabel} setCopyLabel={setCopyLabel} />}
          {tab === 'sell' && <SellTab car={car} onMarkSold={onMarkSold} />}
        </div>
      </div>
    </Overlay>
  );
}

function OverviewTab({ car, onUpdate, reconTotal }) {
  const set = (k) => (e) => onUpdate({ [k]: e.target.value });
  return (
    <div>
      <div style={styles.formGrid}>
        <Field label="Year"><input style={styles.input} value={car.year} onChange={set('year')} /></Field>
        <Field label="Make"><input style={styles.input} value={car.make} onChange={set('make')} /></Field>
        <Field label="Model"><input style={styles.input} value={car.model} onChange={set('model')} /></Field>
        <Field label="Trim"><input style={styles.input} value={car.trim} onChange={set('trim')} /></Field>
        <Field label="VIN"><input className="mono" style={styles.input} value={car.vin} onChange={set('vin')} /></Field>
        <Field label="Mileage"><input style={styles.input} value={car.mileage} onChange={set('mileage')} /></Field>
        <Field label="Purchase price"><input style={styles.input} value={car.purchasePrice} onChange={set('purchasePrice')} /></Field>
        <Field label="Purchase date"><input type="date" style={styles.input} value={car.purchaseDate} onChange={set('purchaseDate')} /></Field>
        <Field label="Source"><input style={styles.input} value={car.source} onChange={set('source')} /></Field>
        <Field label="Title status">
          <select style={styles.input} value={car.titleStatus} onChange={set('titleStatus')}>
            {TITLE_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
      </div>
      <div style={styles.summaryBar}>
        <Row label="Purchase price" value={fmtMoney(car.purchasePrice)} />
        <Row label="Recon cost so far" value={fmtMoney(reconTotal)} />
        <Row label="All-in cost" value={fmtMoney((Number(car.purchasePrice) || 0) + reconTotal)} accent="#E85D2C" />
      </div>
    </div>
  );
}

function ReconTab({ car, onAddRecon, onToggleRecon, onUpdateRecon, onRemoveRecon, reconTotal }) {
  const commonNeeds = ['Order parts', 'Basic detail', 'Professional detail', 'Body shop', 'Tires', 'Brakes', 'Oil change', 'Mechanical repair', 'Other'];
  const [need, setNeed] = useState('Order parts');
  const [customTask, setCustomTask] = useState('');
  const [cost, setCost] = useState('');
  const items = car.reconItems || [];
  const completedCost = items.filter(item => item.done).reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
  const pendingCount = items.filter(item => !item.done).length;
  function submit() {
    const task = need === 'Other' ? customTask.trim() : need;
    if (!task) return;
    onAddRecon(task, cost);
    setCustomTask('');
    setCost('');
  }
  return (
    <div>
      <div style={styles.needsIntro}>Add everything this car needs, enter the amount paid, and check it off when finished.</div>
      <div style={styles.needForm}>
        <Field label="What does it need?">
          <select style={styles.input} value={need} onChange={e => setNeed(e.target.value)}>
            {commonNeeds.map(item => <option key={item} value={item}>{item}</option>)}
          </select>
        </Field>
        <Field label="Amount paid">
          <input type="number" min="0" step="0.01" style={styles.input} placeholder="$0" value={cost} onChange={e => setCost(e.target.value)} />
        </Field>
        {need === 'Other' && (
          <div style={{ ...styles.field, gridColumn: '1 / -1' }}>
            <label style={styles.fieldLabel}>Describe the work</label>
            <input style={styles.input} placeholder="For example: replace windshield" value={customTask} onChange={e => setCustomTask(e.target.value)} />
          </div>
        )}
        <button style={{ ...styles.smallBtn, gridColumn: '1 / -1' }} onClick={submit}>+ Add need and cost</button>
      </div>
      <div style={styles.list}>
        {items.length === 0 && <div style={styles.emptyText}>Nothing has been added yet.</div>}
        {items.map(item => (
          <div key={item.id} style={styles.listItem}>
            <input type="checkbox" checked={item.done} onChange={() => onToggleRecon(item.id)} />
            <div style={{ flex: 1 }}>
              <div style={{ textDecoration: item.done ? 'line-through' : 'none', color: item.done ? '#888D96' : '#EDEEF1' }}>{item.task}</div>
              <div style={{ fontSize: 10, color: item.done ? '#4FA876' : '#D9A441', marginTop: 2 }}>{item.done ? 'COMPLETED' : 'NEEDS ATTENTION'}</div>
            </div>
            <input className="mono" type="number" min="0" step="0.01" aria-label={`Amount paid for ${item.task}`} style={styles.itemCostInput} value={item.cost || ''} placeholder="$0" onChange={e => onUpdateRecon(item.id, { cost: e.target.value })} />
            <button style={styles.iconBtn} onClick={() => onRemoveRecon(item.id)}>×</button>
          </div>
        ))}
      </div>
      <div style={styles.costSummary}>
        <Row label="Items still needed" value={pendingCount} />
        <Row label="Completed work paid" value={fmtMoney(completedCost)} />
        <Row label="Total planned/paid costs" value={fmtMoney(reconTotal)} accent="#E85D2C" />
      </div>
    </div>
  );
}

function CompsTab({ car, onAddComp, onRemoveComp, onUpdate, suggestedPrice }) {
  const [source, setSource] = useState('');
  const [price, setPrice] = useState('');
  const comps = car.comps || [];
  function submit() { if (!price) return; onAddComp(source, price, ''); setSource(''); setPrice(''); }
  return (
    <div>
      <div style={styles.addRow}>
        <input style={{ ...styles.input, flex: 1 }} placeholder="Source (Cargurus, FB...)" value={source} onChange={e => setSource(e.target.value)} />
        <input style={{ ...styles.input, flex: 1 }} placeholder="Price" value={price} onChange={e => setPrice(e.target.value)} />
        <button style={styles.smallBtn} onClick={submit}>+</button>
      </div>
      <div style={styles.list}>
        {comps.length === 0 && <div style={styles.emptyText}>No comps added yet.</div>}
        {comps.map(c => (
          <div key={c.id} style={styles.listItem}>
            <span style={{ flex: 1 }}>{c.source}</span>
            <span className="mono">{fmtMoney(c.price)}</span>
            <button style={styles.iconBtn} onClick={() => onRemoveComp(c.id)}>×</button>
          </div>
        ))}
      </div>
      {suggestedPrice !== null && (
        <div style={styles.summaryBar}><Row label="Median comp price" value={fmtMoney(suggestedPrice)} /></div>
      )}
      <div style={{ marginTop: 12 }}>
        <Field label="Target list price">
          <input style={styles.input} value={car.targetPrice} onChange={e => onUpdate({ targetPrice: e.target.value })} placeholder={suggestedPrice ? String(suggestedPrice) : ''} />
        </Field>
      </div>
    </div>
  );
}

function ListingTab({ car, onUpdate, onGenerate, copyLabel, setCopyLabel }) {
  function copy() {
    if (!car.listingDescription) return;
    navigator.clipboard.writeText(car.listingDescription).then(() => {
      setCopyLabel('Copied'); setTimeout(() => setCopyLabel('Copy'), 1500);
    }).catch(() => {});
  }
  return (
    <div>
      <div style={styles.addRow}>
        <button style={styles.smallBtnWide} onClick={onGenerate}>Generate from car data</button>
        <button style={styles.smallBtnWide} onClick={copy}>{copyLabel}</button>
      </div>
      <textarea style={styles.textarea} rows="10" value={car.listingDescription}
        onChange={e => onUpdate({ listingDescription: e.target.value })}
        placeholder="Click 'Generate from car data' to draft a listing, then edit freely." />
    </div>
  );
}

function SellTab({ car, onMarkSold }) {
  const [price, setPrice] = useState(car.soldPrice || '');
  const [date, setDate] = useState(car.soldDate || new Date().toISOString().slice(0, 10));
  const [error, setError] = useState('');
  function submit() { if (!price) { setError('Enter the sale price.'); return; } onMarkSold(price, date); }
  const recon = (car.reconItems || []).reduce((s, r) => s + (Number(r.cost) || 0), 0);
  const projectedProfit = (Number(price) || 0) - (Number(car.purchasePrice) || 0) - recon;
  return (
    <div>
      <div style={styles.formGrid}>
        <Field label="Sale price"><input style={styles.input} value={price} onChange={e => setPrice(e.target.value)} /></Field>
        <Field label="Sale date"><input type="date" style={styles.input} value={date} onChange={e => setDate(e.target.value)} /></Field>
      </div>
      {error && <div style={styles.errorText}>{error}</div>}
      <div style={styles.summaryBar}>
        <Row label="All-in cost" value={fmtMoney((Number(car.purchasePrice) || 0) + recon)} />
        <Row label="Projected profit" value={fmtMoney(projectedProfit)} accent={projectedProfit >= 0 ? '#4FA876' : '#D4574A'} />
      </div>
      <div style={styles.modalFooter}>
        <button style={styles.primaryBtn} onClick={submit}>Confirm sale</button>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <label style={styles.field}><span style={styles.fieldLabel}>{label}</span>{children}</label>;
}
function Overlay({ children, onClose }) {
  return <div style={styles.overlay} onClick={onClose}><div onClick={e => e.stopPropagation()}>{children}</div></div>;
}
function ModalHeader({ title, subtitle, onClose, right }) {
  return (
    <div style={styles.modalHeader}>
      <div>
        <div style={styles.modalTitle}>{title}</div>
        {subtitle && <div className="mono" style={styles.modalSubtitle}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {right}
        <button style={styles.iconBtnLarge} onClick={onClose}>×</button>
      </div>
    </div>
  );
}
