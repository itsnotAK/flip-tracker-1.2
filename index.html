<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Flip Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><h1>FLIP TRACKER</h1><p>BUY → INSPECT → RECONDITION → LIST → SELL</p></div>
      <div class="top-actions"><button class="btn" id="reportsBtn">Reports</button><button class="btn primary" id="newCarBtn">+ New car</button></div>
    </header>
    <div class="privacy-note">Local mode: records and documents are stored only in this browser. Do not treat this version as secure cloud storage.</div>
    <section class="stats" id="stats"></section>
    <section class="board" id="board"></section>
  </main>

  <dialog id="intakeDialog"><form class="modal" id="intakeForm">
    <header class="modal-head"><div><h2>Purchase a car</h2><p>Decode the VIN, then record the complete acquisition cost.</p></div><button class="icon-btn" type="button" data-close="intake">×</button></header>
    <div class="form-grid">
      <label class="field full"><span>VIN</span><div class="inline"><input id="vin" maxlength="17" placeholder="17-character VIN"><button class="btn" type="button" id="decodeBtn">Decode VIN</button></div><small id="vinStatus">0/17 characters</small></label>
      <label class="field"><span>Year</span><input id="year"></label><label class="field"><span>Make</span><input id="make"></label>
      <label class="field"><span>Model</span><input id="model"></label><label class="field"><span>Trim</span><input id="trim"></label>
      <label class="field"><span>Seller / auction</span><input id="seller"></label><label class="field"><span>Purchase date</span><input id="purchaseDate" type="date"></label>
      <label class="field"><span>Mileage</span><input id="mileage" type="number" min="0"></label><label class="field"><span>Payment method</span><select id="paymentMethod"><option>Cash</option><option>Cashier's check</option><option>Wire transfer</option><option>Financing</option><option>Other</option></select></label>
      <label class="field"><span>Purchase price</span><input id="purchasePrice" type="number" min="0" step=".01"></label><label class="field"><span>Auction fees</span><input id="auctionFees" type="number" min="0" step=".01"></label>
      <label class="field"><span>Taxes</span><input id="taxes" type="number" min="0" step=".01"></label><label class="field"><span>Transportation / towing</span><input id="transportation" type="number" min="0" step=".01"></label>
      <label class="field"><span>Title status</span><select id="titleStatus"><option>Clean</option><option>Salvage</option><option>Rebuilt</option><option>Other</option></select></label>
    </div><p class="error" id="intakeError"></p><footer class="modal-foot"><button class="btn" type="button" data-close="intake">Cancel</button><button class="btn primary" type="submit">Add vehicle</button></footer>
  </form></dialog>
  <dialog id="detailDialog"><section class="modal wide" id="detailContent"></section></dialog>
  <dialog id="reportsDialog"><section class="modal wide" id="reportsContent"></section></dialog>
  <script src="app.js"></script>
</body>
</html>
